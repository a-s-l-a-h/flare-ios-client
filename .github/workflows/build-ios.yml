name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .spm_packages
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Build DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('Package.swift', 'project.yml', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-${{ hashFiles('Package.swift', 'project.yml') }}
            ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies -project FlareApp.xcodeproj -clonedSourcePackagesDirPath .spm_packages

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project FlareApp.xcodeproj \
            -scheme FlareApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath .spm_packages \
            -derivedDataPath build

      - name: Package .app to ZIP
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r FlareApp.zip FlareApp.app

      - name: Upload Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlareApp-simulator-build
          path: build/Build/Products/Debug-iphonesimulator/FlareApp.zip